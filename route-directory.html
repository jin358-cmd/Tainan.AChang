<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>永康清潔車｜完整路線圖</title><link rel="stylesheet" href="route-directory.css"><link rel="stylesheet" href="route-progress.css?v=2"><link rel="stylesheet" href="map-settings.css?v=3"></head><body><header><a href="./">← 志工地圖</a><h1>永康清潔車列表</h1><p>日間 6 車・夜間 24 車｜完整來源站序，不限六里</p></header><main><div class="controls"><div class="directory-shift-control"><span>清運時段</span><input id="shift" type="hidden" value="日間"><span class="directory-shift-buttons" role="group" aria-label="清運時段"><button type="button" data-directory-shift="日間" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M11 0h2v4h-2zM11 20h2v4h-2zM0 11h4v2H0zM20 11h4v2h-4zM3 4l1-1 3 3-1 1zM17 18l1-1 3 3-1 1zM3 20l3-3 1 1-3 3zM17 6l3-3 1 1-3 3z"/></svg>日間</button><button type="button" class="night-shift" data-directory-shift="夜間" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2a9.7 9.7 0 1 0 7 14A8.6 8.6 0 0 1 15 2z"/></svg>夜間</button></span></div><label>搜尋車次、車牌、里別<input id="search" type="search" placeholder="例如：夜間22、KER-3731、神洲"></label><label>開始時段<select id="directoryStartTime" aria-label="完整路線開始時段"><option value="">全部時段</option></select></label><label>結束時段<select id="directoryEndTime" aria-label="完整路線結束時段"><option value="">全部時段</option></select></label><span id="resultCount" role="status"></span></div><section id="directory"><div class="directory-heading"><h3>清潔車列表</h3><span id="directoryRouteSummary" class="directory-route-summary" role="status"></span></div><p class="note">資料為既有 PDF 班表副本（日間160列、夜間1,626列）；原表異常時間與刪除線保留，不代表即時車況。官方頁面與副本可能存在版本差異。</p><div class="table-wrap"><table><thead><tr><th>車次</th><th>車牌</th><th>清運路線序號</th><th>清運方式</th><th>站點列數</th><th>完整路線</th></tr></thead><tbody id="vehicles"></tbody></table></div></section><section id="detail" hidden><div class="route-detail-heading"><h2 id="routeTitle" role="button" tabindex="0" title="選取目前時段站點，再按人員選擇"></h2><button id="print">列印此路線</button></div><div class="detail-head"><button id="back">← 返回清潔車列表</button></div><div id="routeMeta" class="meta"></div><p class="note">以下是你提供範例的「站序路線圖」，按來源順序往返排列，並非實際道路軌跡或導航捷徑。可點站名開啟地址定位。</p><div class="tabs"><button id="diagramTab" aria-pressed="true">完整路線圖</button><button id="listTab" aria-pressed="false">路線資訊／站表</button></div><div class="route-progress"><div class="route-progress-legend" aria-label="站號顏色說明"><span class="progress-past"><i class="stop-key" aria-hidden="true"></i>已過表定時間</span><span class="progress-next"><i class="stop-key" aria-hidden="true"></i>下一站</span><span class="progress-upcoming"><i class="stop-key" aria-hidden="true"></i>尚未到站</span></div><div id="routeProgressClock"></div></div><div id="routeSelectionToolbar" class="route-selection-toolbar" hidden><span id="routeSelectionStatus" role="status">尚未選取站點</span><button type="button" id="routeSelectAll">站點全選（整個車次）</button><button type="button" id="routeClearSelection" disabled>取消選取</button><button type="button" id="routePickPeople" class="primary" disabled>人員選擇</button><small>先單點／複選／全選站點，再選同一人或同組人員；點空白處取消選取。</small></div><div id="routeDiagram" class="diagram"></div><div id="routeTable" class="table-wrap" hidden></div><div class="route-full-disclosure"><button type="button" id="routeFullToggle" class="route-full-toggle" aria-expanded="false" aria-controls="routeFullContent">▸ 查看全部完整路線</button><section id="routeFullContent" aria-label="全部完整路線" hidden><h3>全部站點</h3><div id="routeFullDiagram" class="diagram"></div><div id="routeFullTable" class="table-wrap"></div></section></div></section><p id="loadStatus" role="status">正在讀取完整路線…</p></main><script defer src="dispatch-view.js?v=2"></script><script defer src="route-directory.js?v=21"></script></body></html>
