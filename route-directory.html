<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>永康清潔車｜完整路線圖</title><link rel="stylesheet" href="route-directory.css"><link rel="stylesheet" href="route-progress.css?v=1"></head><body><header><a href="./">← 志工地圖</a><h1>永康清潔車列表</h1><p>日間 6 車・夜間 24 車｜完整來源站序，不限六里</p></header><main><div class="controls"><label>清運時段<select id="shift"><option value="日間" selected>☀️ 日間</option><option value="夜間">🌙 夜間</option><option value="">全部</option></select></label><label>搜尋車次、車牌、里別<input id="search" type="search" placeholder="例如：夜間22、KER-3731、神洲"></label><label>開始時段<input id="directoryStartTime" type="time" aria-label="完整路線開始時段"></label><label>結束時段<input id="directoryEndTime" type="time" aria-label="完整路線結束時段"></label><span id="resultCount" role="status"></span></div><section id="directory"><p class="note">資料為既有 PDF 班表副本（日間160列、夜間1,626列）；原表異常時間與刪除線保留，不代表即時車況。官方頁面與副本可能存在版本差異。</p><div class="table-wrap"><table><thead><tr><th>車次</th><th>車牌</th><th>清運路線序號</th><th>清運方式</th><th>站點列數</th><th>完整路線</th></tr></thead><tbody id="vehicles"></tbody></table></div></section><section id="detail" hidden><div class="detail-head"><button id="back">← 返回清潔車列表</button><button id="print">列印此路線</button></div><h2 id="routeTitle"></h2><div id="routeMeta" class="meta"></div><p class="note">以下是你提供範例的「站序路線圖」，按來源順序往返排列，並非實際道路軌跡或導航捷徑。可點站名開啟地址定位。</p><div class="tabs"><button id="diagramTab" aria-pressed="true">完整路線圖</button><button id="listTab" aria-pressed="false">路線資訊／站表</button></div><div class="route-progress"><div class="route-progress-legend" aria-label="站號顏色說明"><span class="progress-past"><i class="stop-key" aria-hidden="true"></i>已過表定時間</span><span class="progress-next"><i class="stop-key" aria-hidden="true"></i>下一站</span><span class="progress-upcoming"><i class="stop-key" aria-hidden="true"></i>尚未到站</span></div><div id="routeProgressClock"></div></div><div id="routeDiagram" class="diagram"></div><div id="routeTable" class="table-wrap" hidden></div></section><p id="loadStatus" role="status">正在讀取完整路線…</p></main><script defer src="dispatch-view.js?v=2"></script><script defer src="route-directory.js?v=4"></script></body></html>
