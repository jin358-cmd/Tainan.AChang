<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永康日間清運｜獨立測試</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f8fb;color:#173044;margin:0;padding:18px}main{max-width:830px;margin:auto}header,section{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0c304510}button,input{font:inherit}button{cursor:pointer;border:1px solid #b7cbd6;background:#fff;border-radius:9px;padding:12px;margin:4px}button[aria-pressed=true]{background:#134b7a;color:white}h1{font-size:1.4rem}h2{font-size:1.12rem}.muted{color:#4b6575}.warn{background:#fff4d9;border-radius:8px;padding:12px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.time{font-weight:700}#stops li{padding:9px;border-bottom:1px solid #eee}a{color:#005c9b}input{padding:9px;border:1px solid #aac;border-radius:8px}small{display:block}</style></head><body><main><header><h1>🚛 永康區日間清運｜測試檢視</h1><p class="muted">可點選日期與六台車，檢視車牌、一般垃圾／資源回收日、目前已核對站點。</p><p class="warn">⚠️ 此頁僅作路線檢視，不提供登入或志工排班。完整 160 站尚未完成轉錄，不能視為完整路線。</p><a href="./">返回阿昌測試站</a></header><section><label>檢視日期 <input id="day" type="date" value="2026-10-27"></label><p id="weekday"></p><div id="routes" class="row"></div></section><section><h2 id="title">選擇路線</h2><p id="detail"></p><ol id="stops"></ol></section></main><script>let records=[],selected=1;const week=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];const el=id=>document.getElementById(id);function render(){let day=el("day").value||"2026-10-27",w=week[new Date(day+"T12:00:00").getDay()];el("weekday").textContent=day+" "+w;el("routes").innerHTML=records.map(r=>'<button type="button" aria-pressed="'+(r.number===selected)+'" data-n="'+r.number+'">日間'+r.number+' · '+r.plate+' 🗑️'+(r.recycling_status==="有"?" ♻️":"")+'</button>').join("");const r=records.find(x=>x.number===selected);if(!r)return;let running=r.weekdays.includes(w),recycle=(r.recycling_weekdays||[]).includes(w);el("title").textContent="日間"+r.number+"｜"+r.plate;el("detail").textContent=(running?"🗑️ 一般垃圾清運":"本日一般垃圾停收")+"；"+(recycle?"♻️ 今日資源回收":r.recycling_status==="有"?"本日無資源回收":"本路線無資源回收")+"。清運開始："+r.start+"。";el("stops").innerHTML=running?"<li><span class=time>"+r.start+"</span> "+r.name+"（目前僅首站已核對）</li>":"<li>本日沒有這台車的清運站點。</li>";}el("routes").addEventListener("click",e=>{let b=e.target.closest("button[data-n]");if(b){selected=Number(b.dataset.n);render()}});el("day").addEventListener("change",render);fetch("./data-day-routes-six-20261029.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("資料載入失敗");return r.json()}).then(d=>{records=d.routes;render()}).catch(e=>{el("weekday").textContent="載入失敗："+e.message;});</script></body></html>
