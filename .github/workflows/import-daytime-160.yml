name: Import daytime 160 route stops (isolated branch)
on:
  push:
    branches: [feature/daytime-six-plates-20261029]
    paths: [scripts/import_daytime_160.py, .github/workflows/import-daytime-160.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daytime-six-plates-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and verify all 160 stops
        run: python scripts/import_daytime_160.py
      - name: Commit verified data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daytime-160-stops.json
          if ! git diff --cached --quiet; then
            git commit -m "data: import and verify complete 160 daytime stops"
            git push
          fi
