name: One-shot nighttime stop transcription (staging only)
on:
  push:
    branches:
      - feature/daytime-six-plates-20261029
    paths:
      - .github/workflows/achang-night-staging-import-20261029.yml
permissions:
  contents: write
jobs:
  import-staging:
    if: github.repository == 'jin358-cmd/Tainan.AChang'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install HTML parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Collect government route listings into staging only
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          path="data-night-routes-24-20261029.json"
          with open(path,encoding="utf-8") as f:
              d=json.load(f)
          sources={1:6091097622,8:5111503410,11:6351489598,15:6231489605,22:6971338935,23:6351338892,28:6971489631,40:6091144728}
          log=[]
          requests.packages.urllib3.disable_warnings()
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; archival import of open government route tables)"})
          for car,dbid in sources.items():
              route=next(r for r in d["routes"] if r["car"]==car)
              expected=len(route["stops"])
              found={}
              failure=None
              for page in range(1,5):
                  url=f"https://hwms.moenv.gov.tw/dispPageBox/route/routeCP.aspx?dbid={dbid}&ddsPageID=LINEINFO&p={page}"
                  try:
                      resp=session.get(url,timeout=35,verify=False)
                      resp.raise_for_status()
                      resp.encoding=resp.apparent_encoding or "utf-8"
                      soup=BeautifulSoup(resp.text,"html.parser")
                      body=soup.get_text(" ",strip=True)
                      if f"夜間{car:02}" not in body:
                          raise ValueError("route name mismatch")
                      new_count=0
                      for tr in soup.select("tr"):
                          vals=[c.get_text(" ",strip=True) for c in tr.find_all(["td","th"],recursive=False)]
                          if len(vals)<3 or not vals[0].isdigit() or not re.fullmatch(r"\d{1,2}:\d{2}",vals[2]):
                              continue
                          seq=int(vals[0])
                          if not 1<=seq<=expected:
                              continue
                          if seq not in found:
                              found[seq]=(vals[1],vals[2]);new_count+=1
                      if len(found)==expected or (page>1 and new_count==0): break
                  except Exception as ex:
                      failure=repr(ex)
                      break
              if len(found)!=expected:
                  log.append({"car":car,"status":"PENDING","collected":len(found),"expected":expected,"error":failure})
                  continue
              for seq,(name,time) in found.items():
                  s=route["stops"][seq-1]
                  s["name"]=name
                  s["time"]=time
                  s["source_official_url"]=f"https://hwms.moenv.gov.tw/dispPageBox/route/routeCP.aspx?dbid={dbid}&ddsPageID=LINEINFO"
                  s["verification_status"]="GOVERNMENT_ROUTE_BULK_TRANSCRIBED_PENDING_PDF_BATCH_CHECK"
              log.append({"car":car,"status":"TRANSCRIBED_PENDING_VERIFICATION","collected":expected})
          d["government_route_import_log"]=log
          d["merged_source_records"]=sum(bool(s.get("name") and s.get("time")) for r in d["routes"] for s in r["stops"])
          d["missing_stop_details"]=d["total_stops"]-d["merged_source_records"]
          d["status"]="PARTIALLY_POPULATED_UNVERIFIED" if d["missing_stop_details"] else "ALL_STOPS_TRANSCRIBED_PENDING_PDF_VERIFICATION"
          with open(path,"w",encoding="utf-8") as f:json.dump(d,f,ensure_ascii=False,indent=2)
          print("IMPORT_REPORT",json.dumps({"filled":d["merged_source_records"],"missing":d["missing_stop_details"],"routes":log},ensure_ascii=False))
          PY
      - name: Commit staging data without deployment
        run: |
          git config user.name "achang-staging-data-import"
          git config user.email "actions@users.noreply.github.com"
          git add data-night-routes-24-20261029.json
          if ! git diff --cached --quiet; then
            git commit -m "data: batch transcribe government nighttime routes into staging (unverified)"
            git push origin HEAD:feature/daytime-six-plates-20261029
          fi
